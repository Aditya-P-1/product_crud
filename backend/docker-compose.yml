services:
  backend:
    build: .             
    ports:
      - "5000:5000"
    volumes:
      - .:/app          
      - node_modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  node_modules: